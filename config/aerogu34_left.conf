# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y

# RGB LED widget
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# ========================================
# DYA Studio modules (Peripheral side)
# ========================================
# Battery history (data collection on peripheral)
CONFIG_ZMK_BATTERY_HISTORY=y

# Settings RPC (receive settings changes from central)
CONFIG_ZMK_SETTINGS_RPC=y

# Split event relay (peripheral -> central)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Raised 240->512 to match the central side, required for
# zmk-feature-zephyr-setting-expose's larger peripheral relay payloads
# (also satisfies kscan-diagnostics' own 256-byte minimum).
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=512

# KSCAN diagnostics (peripheral side: local collection only, relayed to
# central on request -- no CONFIG_ZMK_STUDIO or *_STUDIO_RPC needed here,
# the peripheral has no Studio connection of its own)
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y

# Setting persistence (matches the central side's レベル2-recommended value)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000