# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y

# RGB LED widget
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# ========================================
# DYA Studio modules (Peripheral side)
# ========================================
# Battery history (data collection on peripheral)
CONFIG_ZMK_BATTERY_HISTORY=y

# Settings RPC (receive settings changes from central)
CONFIG_ZMK_SETTINGS_RPC=y

# Split event relay (peripheral -> central)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# Setting persistence
# (right側と合わせて短縮。60秒だと保存前に電源断/リセットが起きて
#  central側とのボンド情報が食い違い、再ペアリングが必要になっていた)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y